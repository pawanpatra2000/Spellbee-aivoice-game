# ============================================================
# Nginx Configuration for Dual Projects
# - BookLeaf: support.pawanpatra.com (ports 8000, 3000)
# - Spellbee: spellbee.pawanpatra.com (ports 7860, 5173)
# ============================================================

# ============================================================
# BOOKLEAF — support.pawanpatra.com
# ============================================================

# HTTP → HTTPS redirect for BookLeaf
server {
    listen 80;
    server_name support.pawanpatra.com;
    return 301 https://$host$request_uri;
}

# HTTPS BookLeaf
server {
    listen 443 ssl http2;
    server_name support.pawanpatra.com;
    client_max_body_size 50M;

    ssl_certificate     /etc/letsencrypt/live/support.pawanpatra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.pawanpatra.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend — proxy to Vite preview server on port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket — MUST be before /api/ so Nginx matches this first
    location /api/v1/ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API — proxy to FastAPI (uvicorn on :8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # FastAPI auto-docs
    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Static file uploads served directly by nginx
    location /uploads/ {
        alias /root/bookleaf/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ============================================================
# SPELLBEE — spellbee.pawanpatra.com
# ============================================================

# HTTP → HTTPS redirect for Spellbee
server {
    listen 80;
    server_name spellbee.pawanpatra.com;
    return 301 https://$host$request_uri;
}

# HTTPS Spellbee
server {
    listen 443 ssl http2;
    server_name spellbee.pawanpatra.com;
    client_max_body_size 50M;

    ssl_certificate     /etc/letsencrypt/live/spellbee.pawanpatra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spellbee.pawanpatra.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend — proxy to Vite preview server on port 5173
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket for voice pipeline — MUST be before /api/
    location /api/ws/ {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API — proxy to FastAPI (uvicorn on :7860)
    location /api/ {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # FastAPI auto-docs
    location /docs {
        proxy_pass http://127.0.0.1:7860;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:7860;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://127.0.0.1:7860;
        proxy_set_header Host $host;
    }

    # Static file uploads served directly by nginx
    location /uploads/ {
        alias /root/spellbee/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
